# Configurações do Cucumber sobre a JUnit Platform
# Não pergunta/publica relatório no serviço online do Cucumber (os relatórios ficam locais).
cucumber.publish.quiet=true
# Nomes completos (Funcionalidade - Cenário) nos relatórios do Surefire/CI.
cucumber.junit-platform.naming-strategy=long
# Cenários executados em sequência: os testes compartilham o mesmo banco de dados.
cucumber.execution.parallel.enabled=false
